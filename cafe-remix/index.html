<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car modification Menu</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>Car Modification Menu</h1>
        <p class="established">Est. 2020</p>
        <hr>
        <section>
          <h2>Modifications</h2>
          <article class="item">
            <p class="modification">Exhaust System</p><p class="price">500.00</p>
          </article>
          <article class="item">
            <p class="modification">Turbo</p><p class="price">375.00</p>
          </article>
          <article class="item">
            <p class="modification">Headers</p><p class="price">400.00</p>
          </article>
          <article class="item">
            <p class="modification">Muffler</p><p class="price">200.00</p>
          </article>
          <article class="item">
            <p class="modification">Sound system</p><p class="price">350.00</p>
          </article>
        </section>
        <section>
          <h2>Exterior modifications</h2>
          <article class="item">
            <p class="modification">Body Kit</p><p class="price">1000.00</p>
          </article>
          <article class="item">
            <p class="modification">Spoiler</p><p class="price">250.00</p>
          </article>
          <article class="item">
            <p class="modification">Paint Job</p><p class="price">500.00</p>
          </article>
          <article class="item">
            <p class="modification">Carbon fiber parts</p><p class="price">250.00 ea</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank">Visit our website</a>
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
